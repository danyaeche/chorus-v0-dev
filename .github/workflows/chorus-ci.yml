name: chorus CI

on:
  push:
    branches: [main]
    paths:
      - "chorus/**"
      - ".github/workflows/chorus-ci.yml"
  pull_request:
    paths:
      - "chorus/**"
      - ".github/workflows/chorus-ci.yml"

defaults:
  run:
    working-directory: chorus

jobs:
  build:
    runs-on: ubuntu-latest
    # The app builds in demo mode (in-memory seed) with no secrets, so CI needs
    # no Supabase env. See chorus/.env.example.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: chorus/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
