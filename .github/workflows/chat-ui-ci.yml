name: chat-ui CI

on:
  push:
    branches: [main]
    paths:
      - "chat-ui/**"
      - ".github/workflows/chat-ui-ci.yml"
  pull_request:
    paths:
      - "chat-ui/**"
      - ".github/workflows/chat-ui-ci.yml"

defaults:
  run:
    working-directory: chat-ui

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: chat-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
